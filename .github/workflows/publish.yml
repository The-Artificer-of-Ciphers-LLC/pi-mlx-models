name: Publish

# Publishes @taoc/pi-mlx-models to npm when a version tag is pushed (npm version creates v<version>).
# Run it by hand with dry-run left on to check the setup without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and check everything but do not publish
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A named environment lets you require a reviewer before the publish step runs (Settings > Environments).
    environment: npm-publish
    permissions:
      contents: read
      # Lets npm sign a provenance statement linking the tarball to this workflow run.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse a real manual publish from any branch but main
        if: github.event_name == 'workflow_dispatch' && !inputs.dry-run && github.ref != 'refs/heads/main'
        run: |
          echo "a manual publish must run from main (this run is on ${{ github.ref }})" >&2
          exit 1

      - name: Check the tag matches package.json and is on main
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "tag $TAG is not on main; only commits already on main are published" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          awk '/^# tests /{ n = $3 } END { if (n + 0 <= 1) { print "expected more than one test, got " n + 0; exit 1 } }' test.log

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --provenance --access public --dry-run
          else
            npm publish --provenance --access public
          fi
