name: Release

# One manual trigger does the whole release: it bumps the version, updates the changelog, builds and tests, stages the
# release to npm, then commits the bump and tags it on main. Nothing releases automatically; pushing a tag does not.
#
# The file is still called publish.yml because the npm trusted publisher is bound to that file name (and to the
# npm-publish environment below). Renaming either one means re-creating the trusted publisher on npmjs.com.
#
# Authentication is npm trusted publishing (OIDC): there is no npm token and no NPM_TOKEN secret. Do not set
# NODE_AUTH_TOKEN anywhere in this job: even an empty value stops npm falling back to OIDC.
#
# The trusted publisher allows only `npm stage publish` (the direct `npm publish` action is left off, as npm
# recommends). The run stages the release and it goes live when a maintainer approves it with two-factor
# authentication: the Approve button on the package's Staged Packages tab, or `npm stage approve <stage-id>`.
# That approval is the one step left to a person.
#
# Provenance records the commit the run started from, which is the commit before the version bump.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      notes:
        description: One-line changelog note, used only when the Unreleased section of CHANGELOG.md is empty
        type: string
        required: false
      dry-run:
        description: Do everything except stage the release, commit and tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A named environment lets you require a reviewer before the job runs (Settings > Environments).
    # The trusted publisher on npmjs.com names this environment, so it must stay.
    environment: npm-publish
    permissions:
      # Push the release commit and tag.
      contents: write
      # Read the CI result of the commit being released.
      checks: read
      # Lets npm exchange this run's OIDC identity for a short-lived credential, and sign provenance.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
      NOTES: ${{ inputs.notes }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refuse to release from anywhere but main
        if: github.ref != 'refs/heads/main'
        env:
          # Through env, never interpolated into the script: a branch name can hold shell characters.
          RUN_REF: ${{ github.ref }}
        run: |
          echo "a release must run from main (this run is on $RUN_REF)" >&2
          exit 1

      - name: Require the tests to have passed on this commit
        shell: bash
        run: |
          set -euo pipefail
          results="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --paginate \
            --jq '.check_runs[] | select(.name | startswith("test (")) | "\(.name)=\(.status)/\(.conclusion)"')"
          echo "$results"
          if [ "$(printf '%s\n' "$results" | grep -c .)" -lt 2 ]; then
            echo "expected the ubuntu and macOS test checks on $GITHUB_SHA; wait for CI to finish and run again" >&2
            exit 1
          fi
          if printf '%s\n' "$results" | grep -v -q '=completed/success$'; then
            echo "a test check on $GITHUB_SHA has not passed; fix or wait, then run again" >&2
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing and staging need npm 11.15 or later; Node 22 ships an older npm.
      - name: Use an npm that supports trusted publishing and staging
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Bump the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          npm version "$BUMP" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the changelog
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync("CHANGELOG.md", "utf8");
          const heading = /^## Unreleased[ \t]*\r?\n/m;
          const start = heading.exec(text);
          if (!start) throw new Error("CHANGELOG.md has no '## Unreleased' section");
          const bodyStart = start.index + start[0].length;
          const next = text.slice(bodyStart).search(/^## /m);
          const bodyEnd = next === -1 ? text.length : bodyStart + next;
          let body = text.slice(bodyStart, bodyEnd).trim();
          if (!body) {
            const note = (process.env.NOTES ?? "").replace(/\s+/g, " ").trim();
            if (!note) throw new Error("the Unreleased section is empty and no note was given; add one to CHANGELOG.md or fill in the 'notes' input");
            body = `### Changed\n\n- ${note}`;
          }
          const date = new Date().toISOString().slice(0, 10);
          const released = `## ${process.env.VERSION} - ${date}\n\n${body}\n\n`;
          const out = text.slice(0, start.index) + "## Unreleased\n\n" + released + text.slice(bodyEnd);
          fs.writeFileSync("CHANGELOG.md", out);
          NODE
          git --no-pager diff --stat

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          awk '/^# tests /{ n = $3 } END { if (n + 0 <= 1) { print "expected more than one test, got " n + 0; exit 1 } }' test.log

      - name: Show what would be published
        run: npm pack --dry-run

      # Staging comes before the commit and tag on purpose: a staged version can be rejected if a later step
      # fails, whereas a pushed tag is awkward to take back.
      - name: Stage the release on npm
        if: ${{ !inputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish 2>&1 | tee stage.log
          echo "Staged. Approve it on the package's Staged Packages tab, or run: npm stage list" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and tag the release
        if: ${{ !inputs.dry-run }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git tag "v$VERSION"
          if ! git push origin HEAD:main || ! git push origin "v$VERSION"; then
            echo "The version is staged on npm but the commit or tag was not pushed. Reject the staged version (npm stage reject <stage-id>), then run the release again." >&2
            exit 1
          fi
          echo "Committed and tagged v$VERSION on main." >> "$GITHUB_STEP_SUMMARY"
